name: Build & Sign LiteMusic APK

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Shared Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Decode Signing Keystore from GitHub Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "Release keystore decoded successfully from GitHub Secrets."
          else
            echo "Warning: SIGNING_KEYSTORE_BASE64 secret is not set!"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Prepare Signed APK Artifact
        id: prepare_artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          # Use single standard filename for rolling beta release
          cp "$APK_PATH" "LiteMusic-beta.apk"
          echo "apk_path=LiteMusic-beta.apk" >> $GITHUB_OUTPUT
          echo "Prepared LiteMusic-beta.apk successfully."

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteMusic-Release-APK
          path: LiteMusic-beta.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean Old Rolling Release Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking and cleaning legacy assets from beta release..."
          gh release view beta --json assets -q '.assets[].name' 2>/dev/null | while read -r asset; do
            if [ -n "$asset" ] && [ "$asset" != "LiteMusic-beta.apk" ]; then
              echo "Pruning legacy asset: $asset"
              gh release delete-asset beta "$asset" -y || true
            fi
          done || true

      - name: Publish or Update Rolling Beta Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: "LiteMusic Beta (Latest Build)"
          body: |
            Automated rolling release for latest commit: `${{ github.sha }}`.
            Download the pre-signed APK below to install or update directly.
          prerelease: true
          files: LiteMusic-beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
