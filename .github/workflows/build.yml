name: Build & Sign LiteMusic APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Shared Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Release APK (Pre-signed with Dev Keystore)
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Prepare Signed APK Artifact
        id: prepare_artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DEST_NAME="LiteMusic-${SHORT_SHA}-release.apk"
          cp "$APK_PATH" "$DEST_NAME"
          echo "apk_path=$DEST_NAME" >> $GITHUB_OUTPUT
          echo "Found and prepared: $DEST_NAME"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteMusic-Release-APK
          path: ${{ steps.prepare_artifact.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_artifact.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
